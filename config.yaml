# ── Konfigurasi Bot Trading ─────────────────────────────────────
# Semua nilai bisa dioverride lewat menu interaktif atau flag CLI.

# Umum
exchange: binance          # sumber harga (paper = data publik, tanpa API key)
symbol: BTC/USDT           # pasangan yang ditradingkan
timeframe: 1m              # ukuran candle: 1m, 5m, 15m, 1h, ...
strategy: sma              # strategi aktif: sma | rsi | grid
solana_mint: ""            # isi mint address token = mode PAPER Solana DEX (pantau token itu)
starting_cash: 5.0         # ← GANTI sesuai modalmu (mis. 5, 20, 100)
fee_rate: 0.001            # fee per transaksi (0.001 = 0.1%)
min_notional: 5.0          # nilai order minimum exchange
poll_interval_sec: 60      # jeda cek harga (detik) saat mode live

# Strategi SMA crossover
sma_fast: 9
sma_slow: 21

# Strategi RSI
rsi_period: 14
rsi_oversold: 30           # beli saat RSI di bawah ini
rsi_overbought: 70         # jual saat RSI di atas ini

# Strategi Grid / DCA
grid_step_pct: 0.02        # beli lagi tiap harga turun 2% dari beli terakhir
grid_take_profit_pct: 0.03 # jual semua saat naik 3% dari entry rata-rata
grid_max_steps: 5          # modal dibagi jadi 5 bagian

# Manajemen risiko GLOBAL (berlaku untuk semua strategi; 0 = nonaktif)
stop_loss_pct: 0.0         # mis. 0.05 = jual bila rugi 5%
take_profit_pct: 0.0       # mis. 0.10 = jual bila untung 10%

# Notifikasi Telegram (lebih aman lewat env: TELEGRAM_TOKEN, TELEGRAM_CHAT_ID)
telegram_token: ""
telegram_chat_id: ""

# Mode uang REAL — biarkan false kecuali kamu benar-benar paham risikonya.
# API key WAJIB lewat env: EXCHANGE_API_KEY, EXCHANGE_API_SECRET (jangan di sini!)
live_real: false           # true = order pakai uang asli
live_sandbox: true         # true = testnet/sandbox (uang bohongan, alur asli)

# File output (otomatis dibuat)
state_file: state.json
trades_file: trades.csv
