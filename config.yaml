# ── llnx configuration ──────────────────────────────────────────
# Every value can be overridden from the menu, the TUI or a CLI flag.

# general
exchange: binance          # price source (public data, no API key needed)
symbol: BTC/USDT           # pair to trade
timeframe: 1m              # candle size: 1m, 5m, 15m, 1h, ...
strategy: sma              # sma | ema | breakout | rsi | grid
token_address: ""          # set a token address to trade it on a DEX instead
chain: solana              # solana | ethereum | bsc | base | arbitrum | polygon
starting_cash: 5.0         # your capital (5, 20, 100, ...)
fee_rate: 0.001            # fee per trade (0.001 = 0.1%)
min_notional: 5.0          # smallest order the exchange accepts
poll_interval_sec: 60      # seconds between price checks when running

# ── auto-execution ─────────────────────────────────────────────
# paper   : simulated orders, no money, no keys
# sandbox : exchange testnet, or a Solana dry run on real Jupiter quotes
# live    : REAL orders with REAL money
mode: paper
auto_execute: true         # false = decide and log, but send nothing

# guardrails, checked before every order (0 = off)
max_daily_loss_pct: 0.10   # stop buying after -10% on the day (exits still work)
max_trades_per_day: 20
cooldown_sec: 0            # minimum seconds between orders
max_order_pct: 0.0         # 0.25 = never spend more than 25% of equity at once
max_consecutive_failures: 3  # stand down after this many failed orders in a row
kill_switch_file: STOP     # `llnx stop` creates it, `llnx resume` removes it

# SMA crossover
sma_fast: 9
sma_slow: 21

# EMA crossover, entries only while the price is above the trend EMA.
# Fewer trades than plain SMA, and it sits out sideways markets.
ema_fast: 12
ema_slow: 26
ema_trend: 100

# Donchian breakout: buy above the high of the last N candles, leave on the
# low of the last M, or when the price falls back through a volatility stop.
breakout_entry: 20
breakout_exit: 10
breakout_atr_period: 14
breakout_atr_mult: 2.0

# RSI
rsi_period: 14
rsi_oversold: 30           # buy when RSI drops below this
rsi_overbought: 70         # sell when RSI rises above this

# Grid / DCA
grid_step_pct: 0.02        # buy again every 2% below the last buy
grid_take_profit_pct: 0.03 # sell everything 3% above the average entry
grid_max_steps: 5          # capital split into 5 chunks

# global risk management (applies to every strategy; 0 = off)
stop_loss_pct: 0.0         # 0.05 = sell at 5% loss
take_profit_pct: 0.0       # 0.10 = sell at 10% profit
trailing_stop_pct: 0.0     # 0.05 = sell 5% below the peak since entry.
                           # Usually better than a fixed take-profit: it lets
                           # a winner run instead of capping it.

# solana swaps
jupiter_slippage_bps: 100  # 100 = 1% max slippage on a real swap
safety_check: true         # honeypot/authority check before trading a token
# Jupiter moves its public endpoints now and then. Leave these empty for the
# built-in defaults (lite-api.jup.ag). If a quote 404s or the host is gone,
# put the current one here — the previous generation was:
#   jupiter_api_url: https://quote-api.jup.ag/v6
#   jupiter_tokens_url: https://tokens.jup.ag/token
jupiter_api_url: ""
jupiter_tokens_url: ""

# telegram notifications (env vars are safer: TELEGRAM_TOKEN, TELEGRAM_CHAT_ID)
telegram_token: ""
telegram_chat_id: ""

# keys NEVER live here. They come from the environment:
#   EXCHANGE_API_KEY / EXCHANGE_API_SECRET     exchange orders
#   SOLANA_PRIVATE_KEY / SOLANA_RPC_URL        solana swaps

# output files (created automatically)
state_file: state.json
trades_file: trades.csv
orders_file: orders.jsonl  # every order attempt: filled, blocked or failed
